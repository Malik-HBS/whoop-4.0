name: OpenWhoop
options:
  bundleIdPrefix: com.openwhoop
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  WhoopProtocol:
    path: ../Packages/WhoopProtocol
  WhoopStore:
    path: ../Packages/WhoopStore
  WhoopMetrics:
    path: ../Packages/WhoopMetrics
targets:
  OpenWhoop:
    type: application
    platform: iOS
    sources:
      - path: OpenWhoop
        excludes:
          - Info.plist
          - Info.Debug.plist
          - Info.Release.plist
    configFiles:
      Debug: OpenWhoop/Config/Secrets.xcconfig
      Release: OpenWhoop/Config/Secrets.xcconfig
    dependencies:
      - package: WhoopProtocol
      - package: WhoopStore
      - package: WhoopMetrics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENWHOOP_APP_BUNDLE_ID)
      configs:
        Debug:
          INFOPLIST_FILE: OpenWhoop/Info.Debug.plist
        Release:
          INFOPLIST_FILE: OpenWhoop/Info.Release.plist
  OpenWhoopTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OpenWhoopTests]
    dependencies:
      - target: OpenWhoop
      - package: WhoopProtocol
      - package: WhoopStore
      - package: WhoopMetrics
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(OPENWHOOP_TESTS_BUNDLE_ID)
