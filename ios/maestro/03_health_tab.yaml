appId: com.openwhoop.OpenWhoop
---
# Flow 3: Health tab placeholder
# Verifies: Health tab is reachable while the section is empty.

- launchApp
- runFlow: utils/allow_notifications.yaml

- waitForAnimationToEnd:
    timeout: 8000

- tapOn:
    text: "Health"

- waitForAnimationToEnd:
    timeout: 4000

- assertVisible:
    text: "Health"

- takeScreenshot: /tmp/maestro_03_health.png
